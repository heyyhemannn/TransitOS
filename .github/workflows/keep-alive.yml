name: Keep Render & Supabase Alive

on:
  schedule:
    # Runs every 25 minutes — keeps Render free tier from sleeping (24/7)
    - cron: '*/25 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping Render backend /health
        run: |
          URL="https://transitos-apd4.onrender.com/health"
          echo "Pinging $URL ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 --max-time 30 "$URL" || echo "000")
          echo "Response status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Server is alive"
          else
            echo "⚠️ Server returned $STATUS — waking up or temporary delay"
          fi

      - name: Ping Vercel frontend
        run: |
          URL="https://transitos.vercel.app"
          echo "Pinging $URL ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --retry 2 --max-time 30 "$URL" || echo "000")
          echo "Response status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Frontend is alive"
          else
            echo "⚠️ Frontend returned $STATUS"
          fi
